name: Build chelle-fulk-main for superb.net

on:
  push:
    branches:
      - main
      - setup-db-connection
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install
        working-directory: ./chelle-fulk-main

      - name: Build the React app
        run: npm run build
        working-directory: ./chelle-fulk-main

      - name: Create API directory and copy PHP files
        run: |
          mkdir -p chelle-fulk-main/build/api
          cp chelle-fulk-main/api/*.php chelle-fulk-main/build/api/
          echo "DB_HOST=${{ secrets.DB_HOST }}" > chelle-fulk-main/build/api/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> chelle-fulk-main/build/api/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> chelle-fulk-main/build/api/.env

      - name: Deploy to superb.net via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.gip.superb.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: chelle-fulk-main/build/
          server-dir: chellefulk.com/public_html/
          timeout: 30000          # 30 second timeout
          passive: true           # Better connection handling
          log-level: verbose      # See what's happening

      - name: Explicit FTP Connection Close
        if: always()              # Run even if FTP step fails
        run: |
          echo "Forcing any lingering FTP connections to timeout..."
          # Kill any processes that might be holding FTP connections
          pkill -f "ftp" || echo "No FTP processes found"
          sleep 10
          echo "FTP connection cleanup complete"
