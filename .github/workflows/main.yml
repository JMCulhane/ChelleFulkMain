name: Build chelle-fulk-main for superb.net

on:
  push:
    branches:
      - main
      - setup-db-connection
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install
        working-directory: ./chelle-fulk-main

      - name: Build the React app
        run: npm run build
        working-directory: ./chelle-fulk-main

      - name: Create .env file for PHP
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" > chelle-fulk-main/build/api/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> chelle-fulk-main/build/api/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> chelle-fulk-main/build/api/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> chelle-fulk-main/build/api/.env

      - name: Copy PHP files to build directory
        run: |
          mkdir -p chelle-fulk-main/build/api
          cp chelle-fulk-main/api/*.php chelle-fulk-main/build/api/

      - name: Deploy to superb.net via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.gip.superb.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: chelle-fulk-main/build/
          server-dir: chellefulk.com/public_html/
